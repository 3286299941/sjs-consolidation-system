{% extends "base.html" %}

{% block content %}
<style>
 @keyframes shake {
 0%, 100% { transform: translateX(0); }
 25% { transform: translateX(-6px); }
 50% { transform: translateX(6px); }
 75% { transform: translateX(-4px); }
 }
 @keyframes pulse-warning {
 0%, 100% { border-color: var(--warning); }
 50% { border-color: #dc2626; }
 }
 .readiness-banner {
 animation: shake 0.5s ease-in-out;
 }
 .group-panel { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 18px; }
 .group-card { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; margin-bottom: 6px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: all 0.2s; font-size: 13px; }
 .group-card:hover { border-color: var(--accent); background: rgba(99,102,241,0.04); }
 .group-card.active { border-color: var(--accent); background: rgba(99,102,241,0.08); }
 .group-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: rgba(99,102,241,0.12); color: var(--accent-hover); }
 .carton-group-select { font-size: 11px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-input); color: var(--text); max-width: 120px; }
 .carton-group-select option { font-size: 11px; }
</style>
<div class="card">
 <div class="card-title">合箱管理</div>

 <!-- 合箱准备状态提示横幅 -->
 <div id="readiness-banner" style="display:none; padding:14px 18px; border-radius:10px; margin-bottom:18px; font-size:14px; line-height:1.7;"></div>

 <!-- 顶部：批次选择 -->
 <div style="margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
 <div style="display: flex; align-items: center; gap: 8px;">
 <label style="font-weight: 500; font-size: 14px; white-space: nowrap;"> 选择批次：</label>
 <select id="batch-select" onchange="selectBatch()" style="padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; min-width: 220px;">
 <option value="">-- 请选择批次 --</option>
 {% for item in all_batches %}
 <option value="{{ item.batch.id }}">
 批次 {{ item.batch.batch_no }} | P{{ item.regular_count }} M{{ item.sensitive_count }} | {{ item.carton_count }}箱 | 邮编 {{ item.batch.zip_code or '未设' }}
 </option>
 {% endfor %}
 </select>
 <button class="btn btn-secondary" onclick="location.reload()" style="padding: 6px 12px; font-size: 13px;"> 刷新</button>
 <button class="btn" onclick="if(document.getElementById('batch-select').value)selectBatch()" style="padding: 6px 12px; font-size: 13px; background: #1565c0; color: #fff; border-radius: 6px;"> 加载</button>
 <button class="btn" onclick="exportBulkCartonLabels()" style="padding: 6px 14px; font-size: 13px; background: #4527a0; color: #fff; border-radius: 6px;" title="导出所有未锁定批次中多客户混装的散箱标签"> 📦 散箱标签一键导出</button>
 <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; margin-left: 6px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: #fff;">
 <input type="checkbox" id="only-fullbox" onchange="toggleFullBoxOnly()" style="width: 16px; height: 16px; cursor: pointer;"> 仅看整箱
 </label>
 <select id="san-export-type" style="padding: 6px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: #fff; margin-left: 6px;" title="选择导出箱型">
 <option value="all">普货 + 敏货</option>
 <option value="puhuo">仅普货</option>
 <option value="minhuo">仅敏货</option>
 </select>
 <select id="san-export-batch" style="padding: 6px 10px; font-size: 13px; border: 1px solid var(--border); border-radius: 6px; background: #fff; margin-left: 4px;" title="选择批次（默认全部未锁定批次）">
 <option value="">全部未锁定批次</option>
 {% for item in all_batches %}
 <option value="{{ item.batch.id }}">{{ item.batch.batch_no }}</option>
 {% endfor %}
 </select>
 </div>

 <!-- 散箱导出进度条 -->
 <div id="bulk-export-progress" style="display:none; margin-bottom:16px; background:#1e293b; border:1px solid #334155; border-radius:8px; padding:12px 16px;">
   <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
     <span style="font-size:14px;">⏳ 正在生成散箱标签 PDF...</span>
     <span id="bulk-export-percent" style="font-size:13px;color:#67e8f9;">0%</span>
   </div>
   <div style="height:6px;background:#334155;border-radius:3px;overflow:hidden;">
     <div id="bulk-export-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#4527a0,#7c4dff);border-radius:3px;transition:width 0.3s;"></div>
   </div>
 </div>

 <div style="margin-left: auto; font-size: 13px; color: var(--text-secondary);">
 <span>已选 <strong id="selected-count-display" style="color: var(--accent-hover);">0</strong> 个包裹</span>
 &nbsp;|&nbsp;
 <span>当前箱型: <strong id="current-type-display" style="color: var(--accent-hover);">--</strong></span>
 </div>
 </div>

 <!-- 主区域 -->
 <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
 <!-- 左侧：包裹选择区 -->
 <div>
 <!-- 普货包裹 -->
 <div id="p-section" style="display: none;">
 <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
 <h4 style="margin: 0; color: #16a34a;"> P 普货 <span id="p-count" style="font-size: 13px; color: var(--text-secondary);"></span></h4>
 <div>
 <button class="btn btn-sm" onclick="selectAllP()" style="padding: 3px 10px; font-size: 12px;">全选</button>
 <button class="btn btn-sm btn-secondary" onclick="deselectAllP()" style="padding: 3px 10px; font-size: 12px;">取消</button>
 </div>
 </div>
 <div id="p-list" style="max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-input);"></div>
 </div>

 <!-- 敏货包裹 -->
 <div id="m-section" style="display: none; margin-top: 15px;">
 <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
 <h4 style="margin: 0; color: #dc2626;"> M 敏货 <span id="m-count" style="font-size: 13px; color: var(--text-secondary);"></span></h4>
 <div>
 <button class="btn btn-sm" onclick="selectAllM()" style="padding: 3px 10px; font-size: 12px;">全选</button>
 <button class="btn btn-sm btn-secondary" onclick="deselectAllM()" style="padding: 3px 10px; font-size: 12px;">取消</button>
 </div>
 </div>
 <div id="m-list" style="max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-input);"></div>
 </div>

 <!-- 合箱模式切换 -->
 <div style="margin-top: 15px; padding: 10px 15px; background: rgba(99,102,241,0.06); border-radius: 8px;">
 <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 8px;">
 <span style="font-size: 13px; font-weight: 600;">合箱模式：</span>
 <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px;">
 <input type="radio" name="carton-mode" value="one-by-one" onchange="switchMode()">
 逐个合箱（扫一个建一个）
 </label>
 <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px;">
 <input type="radio" name="carton-mode" value="batch" checked onchange="switchMode()">
 批量选择（选完一起建）
 </label>
 </div>
 <div id="mode-hint" style="font-size: 11px; color: var(--text-secondary);">扫码选中包裹，确认后手动创建箱子</div>
 </div>

 <!-- 扫码输入 -->
 <div style="margin-top: 10px; padding: 12px; background: rgba(99,102,241,0.06); border-radius: 8px;">
 <div style="display: flex; gap: 10px; align-items: center;">
 <span style="font-size: 13px; font-weight: 500;"> 扫码：</span>
 <input type="text" id="scan-input" placeholder="扫描包裹标签条形码（纯数字ID）" onkeydown="handleScanKey(event)" oninput="handleScanInput(event)"
 style="flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;">
 <button class="btn" id="scan-btn" onclick="scanAdd()" style="padding: 8px 15px; font-size: 13px;">合箱</button>
 <button class="camera-btn camera-btn-xs" onclick="openCameraScanner('scan-input')" title="摄像头扫描"></button>
 </div>
 <div style="display: flex; align-items: center; gap: 20px; margin-top: 8px;">
 <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px;">
 <input type="checkbox" id="auto-scan-mode" onchange="toggleAutoScan()" style="width: 16px; height: 16px;">
 <span style="color: var(--accent-hover);"> 扫码自动提交（无需按Enter）</span>
 </label>
 <span style="font-size: 11px; color: var(--text-secondary);">
 扫描包裹标签条形码（全局唯一数字ID），扫码自动匹配包裹
 </span>
 </div>
 </div>

 <!-- 扫描结果日志 -->
 <div id="scan-log" style="display: none; margin-top: 10px; max-height: 150px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-input); padding: 8px;">
 </div>

 <!-- 当前箱子预览 -->
 <div style="margin-top: 15px; padding: 15px; background: linear-gradient(135deg, rgba(6,182,212,0.08), rgba(6,182,212,0.04)); border: 2px dashed var(--accent); border-radius: 8px; min-height: 80px;">
 <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
 <strong> 当前箱子</strong><span id="last-selected-hint" style="font-size:11px;color:#94a3b8;margin-left:8px;"></span>
 <div style="display:flex;align-items:center;gap:8px;font-size:12px;">
 <span style="color:#64748b;">箱重</span>
 <input type="number" id="box-tare-weight" value="0.90" step="0.1" min="0" style="width:55px;padding:3px 6px;border:1px solid var(--border);border-radius:4px;font-size:12px;text-align:center;" onchange="saveBoxTareWeight()"> kg
 <button class="btn btn-sm btn-secondary" onclick="clearCurrentBox()" style="padding: 3px 10px; font-size: 12px;">清空</button>
 </div>
 </div>
 <div id="current-box-preview" style="font-size: 13px; color: var(--text-secondary);">
 尚未选择包裹
 </div>
 <div id="create-box-buttons" style="margin-top: 12px; display: none; gap: 10px;">
 <button class="btn" id="create-p-btn" onclick="createBox('普')" style="padding: 8px 20px; background: #16a34a; color: white;"> 创建 P 箱</button>
 <button class="btn" id="create-m-btn" onclick="createBox('敏')" style="padding: 8px 20px; background: #dc2626; color: white;"> 创建 M 箱</button>
 </div>
 </div>

 <!-- 一键合箱（保留） -->
 <div id="one-click-section" style="display: none; margin-top: 15px;">
 <div style="display: flex; gap: 10px;">
 <button class="btn" onclick="oneClickCreate('普')" style="flex: 1; padding: 10px; background: #16a34a; color: white;">
 一键合箱 P（全部普货）
 </button>
 <button class="btn" onclick="oneClickCreate('敏')" style="flex: 1; padding: 10px; background: #dc2626; color: white;">
 一键合箱 M（全部敏货）
 </button>
 </div>
 </div>
 </div>

 <!-- 右侧：分组管理 + 箱子列表 -->
 <div>
 <!-- 分组管理面板 -->
 <div class="group-panel" id="group-panel" style="display:none;">
 <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
 <h4 style="margin: 0; font-size: 14px; color: var(--accent-hover);"> 分组管理</h4>
 <div style="display: flex; gap: 6px;">
 <button class="btn btn-sm" onclick="showCreateGroupModal()" style="padding: 4px 10px; font-size: 12px;">+ 新建分组</button>
 <button class="btn btn-sm btn-secondary" onclick="autoGroupByZip()" style="padding: 4px 10px; font-size: 12px;" title="按邮编+客户地址自动分组"> 自动分组</button>
 </div>
 </div>
 <div id="group-list" style="max-height: 200px; overflow-y: auto;">
 <div style="font-size: 12px; color: var(--text-secondary);">选择批次后加载分组</div>
 </div>
 </div>

 <h3 style="margin-bottom: 15px; color: var(--accent-hover);"> 箱子列表</h3>

 <div id="carton-list">
 <div class="empty-state" style="padding: 30px;">
 <p>请选择批次后加载</p>
 </div>
 </div>
 <div id="carton-list-pagination" class="pagination-container"></div>
 </div>
 </div>
</div>

<!-- 箱子详情弹窗 -->
<div class="modal" id="carton-detail-modal">
 <div class="modal-content" style="max-width: 600px;">
 <div class="modal-title" id="detail-title">箱子详情</div>
 <div id="detail-content">
 <div style="text-align: center; padding: 30px;">加载中...</div>
 </div>
 <div class="modal-footer">
 <button class="btn btn-danger" onclick="deleteCarton()">删除箱子</button>
 <button class="btn btn-secondary" onclick="closeDetailModal()">关闭</button>
 <button class="btn" onclick="updateCartonInfo()">保存尺寸信息</button>
 </div>
 </div>
</div>

<!-- 分组创建/编辑弹窗 -->
<div class="modal" id="group-modal">
 <div class="modal-content" style="max-width: 450px;">
 <div class="modal-title" id="group-modal-title">新建分组</div>
 <div class="form-group">
 <label>分组名称 *</label>
 <input type="text" id="group-name" placeholder="如：邮编91001-王先生" style="width: 100%;">
 </div>
 <div class="form-group">
 <label>邮编（可选）</label>
 <input type="text" id="group-zip" placeholder="如：91001" style="width: 100%;">
 </div>
 <input type="hidden" id="group-edit-id" value="">
 <div class="modal-footer">
 <button class="btn btn-secondary" onclick="closeGroupModal()">取消</button>
 <button class="btn btn-danger" id="group-delete-btn" onclick="deleteGroup()" style="display: none;">删除分组</button>
 <button class="btn" onclick="saveGroup()">保存</button>
 </div>
 </div>
</div>
</div>

<!-- 追加包裹弹窗 -->
<div class="modal" id="add-packages-modal">
<div class="modal-content" style="max-width: 500px;">
<div class="modal-title">追加包裹到箱子</div>
<div class="form-group">
<label>选择要追加的包裹（仅显示当前批次未合箱的包裹）</label>
<div id="add-packages-list" style="max-height: 300px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; padding: 10px; background: var(--bg-input);">
<div style="font-size: 12px; color: var(--text-secondary);">加载中...</div>
</div>
</div>
<input type="hidden" id="add-carton-id" value="">
<div class="modal-footer">
<button class="btn btn-secondary" onclick="closeAddPackagesModal()">取消</button>
<button class="btn" onclick="confirmAddPackages()">确认追加</button>
</div>
</div>
</div>

<script>
 'use strict';

 // ========== 数据状态 ==========
 let currentBatchId = null;
 let allPackages = { p: [], m: [] }; // { id, serial_label, customer_name, nature, selected }
 let showFullBoxOnly = false; // 合箱管理：仅看整箱筛选
 let selectedPackageIds = new Set();
 let isCreating = false;
 let cartonMode = 'batch'; // 'one-by-one' | 'batch'，默认批量选择
 let scanLog = []; // [{ time, type, input, result, carton_name }]
 let autoScanMode = false; // 自动扫码提交模式
 let autoScanTimer = null; // 自动扫码防抖计时器
 const AUTO_SCAN_DELAY = 300; // 300ms防抖，适合扫码枪
 let groups = []; // [{id, name, zip_code, p_count, m_count, carton_count}]
 let selectedGroupId = null; // 当前选中的分组筛选

 // ===== 合箱准备状态 =====
 let readinessState = { ready: true, has_unpacked: false, has_incomplete: false, unpacked_warnings: [], incomplete_packages: [] };

 // ========== 批次选择 ==========
 async function selectBatch() {
 const batchId = document.getElementById('batch-select').value;
 if (!batchId) {
 hideAll();
 return;
 }
 currentBatchId = parseInt(batchId);
 clearCurrentBox();
 document.getElementById('scan-input').value = '';
 await loadBatchPackages(currentBatchId);
 await loadCartonList(currentBatchId);
 await loadGroupList(currentBatchId);
 await checkCartonReadiness(currentBatchId);
 }

 async function loadBatchPackages(batchId) {
 try {
 const result = await apiRequest(`/api/carton/batch_packages?batch_id=${batchId}`);
 // result: { p: [...], m: [...] }
 allPackages.p = (result.p || []).map(pkg => ({ ...pkg, selected: false }));
 allPackages.m = (result.m || []).map(pkg => ({ ...pkg, selected: false }));
 renderPackageLists();
 updateCreateButtons();
 } catch (e) {
 showToast('加载包裹失败: ' + (e.message || '未知错误'), 'error');
 }
 }

 // ===== 箱子列表加载（动态刷新） =====
 async function loadCartonList(batchId) {
 try {
 const url = batchId ? `/api/carton/list?batch_id=${batchId}` : '/api/carton/list';
 const result = await apiRequest(url);
 renderCartonList(result.data || []);
 } catch (e) {
 console.error('加载箱子列表失败:', e);
 }
 }

 function renderCartonList(cartons) {
 const container = document.getElementById('carton-list');
 if (!cartons || cartons.length === 0) {
 container.innerHTML = '<div class="empty-state" style="padding: 30px;"><p>暂无箱子</p></div>';
 return;
 }

 container.innerHTML = cartons.map(c => {
 const typeBadge = c.carton_type === '敏' ? 'M' : 'P';
 const badgeClass = c.carton_type === '敏' ? 'badge-danger' : 'badge-success';
 const sizeInfo = c.length > 0
 ? `<p>箱规: ${c.length}×${c.width}×${c.height} cm | 重量: ${c.total_weight} kg | 体积重: ${c.volume_weight} kg | ${c.package_count}个包裹</p>`
 : '<p style="color: #dc2626;">* 尺寸信息未填写</p>';
 const shippedBadge = c.is_shipped ? '<span class="badge badge-info" style="margin-left: 6px;">已发货</span>' : '';
 // 分组信息
 const groupName = c.group_id ? (groups.find(g => g.id === c.group_id) || {}).name || `分组#${c.group_id}` : '';
 const groupBadge = c.group_id ? `<span class="group-badge"> ${groupName}</span>` : '';
 // 移动分组下拉选项
 const groupOptions = groups.map(g => `<option value="${g.id}" ${g.id === c.group_id ? 'selected' : ''}>${escapeHtml(g.name)}</option>`).join('');
 const moveDropdown = groups.length > 0 ? `
 <select class="carton-group-select" onchange="moveCarton(${c.id}, this.value)" onclick="event.stopPropagation()" title="移动分组">
 <option value="">未分组</option>
 ${groupOptions}
 </select>` : '';

 const customerNames = c.customer_names || [];
 const isMultiCustomer = customerNames.length > 1;
 const pdfLabel = isMultiCustomer ? `${c.package_count}件货` : (customerNames[0] || '下载PDF');

 return `
 <div class="carton-item" style="padding: 15px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 15px; background: var(--bg-input);">
 <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
 <div>
 <strong style="font-size: 16px;">${escapeHtml(c.name)}</strong>
 <span class="badge ${badgeClass}" style="margin-left: 10px;">${typeBadge}</span>
 ${c.batch_no ? `<span style="font-size: 12px; color: var(--text-secondary); margin-left: 8px;">批次 ${escapeHtml(c.batch_no)}</span>` : ''}
 ${groupBadge}
 ${shippedBadge}
 </div>
 <div style="display: flex; align-items: center; gap: 6px;">
 ${moveDropdown}
 <button class="btn btn-secondary" onclick="showCartonDetails(${c.id})" style="padding: 5px 10px; font-size: 12px;">查看详情</button>
 <button class="btn" onclick="showAddPackagesModal(${c.id}, '${escapeHtml(c.carton_type)}')" style="padding: 5px 10px; font-size: 12px; background: #0d9488; color: white;">+ 追加</button>
 <button class="btn" onclick="printCartonLabel(${c.id})" style="padding: 5px 10px; font-size: 12px;"> 合箱标签</button>
 <button class="btn" onclick="pdfCartonLabel(${c.id})" style="padding: 5px 10px; font-size: 12px; background: var(--accent);">${escapeHtml(pdfLabel)}</button>
 <button class="btn" onclick="rollbackCarton(${c.id}, '${escapeHtml(c.name)}')" style="padding: 5px 10px; font-size: 12px; background: var(--warning); color: #fff;">↩ 回退</button>
 </div>
 </div>
 <div style="font-size: 13px; color: var(--text-secondary);">
 <p>创建时间: ${c.created_at}</p>
 ${sizeInfo}
 ${c.customer_remarks ? `<p style="margin-top: 6px; background: rgba(245,158,11,0.1); border-left: 3px solid #f59e0b; padding: 4px 10px; border-radius: 3px; font-size: 12px; color: #92400e; font-weight: 500;"> 客户备注：${escapeHtml(c.customer_remarks)}</p>` : ''}
 </div>
 </div>`;
 }).join('');
 }

 // ===== 合箱准备状态检查 =====
 async function checkCartonReadiness(batchId) {
 try {
 const result = await apiRequest(`/api/carton/readiness_check?batch_id=${batchId}`);
 readinessState = result.data || { ready: true, has_unpacked: false, has_incomplete: false, unpacked_warnings: [], incomplete_packages: [] };
 } catch (e) {
 // 检查失败不阻断流程
 readinessState = { ready: true, has_unpacked: false, has_incomplete: false, unpacked_warnings: [], incomplete_packages: [] };
 return;
 }
 renderReadinessBanner();
 }

 function renderReadinessBanner() {
 const banner = document.getElementById('readiness-banner');
 if (readinessState.ready) {
 banner.style.display = 'none';
 return;
 }

 banner.style.display = 'block';
 banner.classList.remove('readiness-banner');
 void banner.offsetWidth; // reflow
 banner.classList.add('readiness-banner');

 let html = '';
 let bgColor = 'rgba(217,119,6,0.08)';
 let borderColor = '#d97706';
 let icon = '';

 if (readinessState.has_unpacked && readinessState.has_incomplete) {
 bgColor = 'rgba(220,38,38,0.08)';
 borderColor = '#dc2626';
 icon = '';
 } else if (readinessState.has_unpacked) {
 icon = '';
 }

 html += `<div style="font-weight:700; color:${borderColor}; font-size:15px; margin-bottom:10px;">${icon} 合箱操作被阻止 - 以下问题需要先解决：</div>`;

 // 未打包包裹警告

 }

 banner.style.background = bgColor;
 banner.style.border = `2px solid ${borderColor}`;
 banner.innerHTML = html;

 // ========== 解析扫码数据 ==========
 // 扫码数据格式: "serial_label|nature_char" 如 "2-1|P"、"3-2|M"
 // 也兼容直接扫描 serial_label 如 "2-1"
 // 扫码数据格式: 纯数字=包裹ID（精准匹配），或 "serial_label|nature"
 function parseScanData(input) {
 input = input.trim();
 // 纯数字 → 包裹ID（条码内容为 packed.id）
 if (/^\d+$/.test(input)) {
 return { id: parseInt(input, 10), serial_label: null, nature: null };
 }
 // 格式: "serial_label|P" 或 "serial_label|M"
 const match = input.match(/^(.+?)\|([PM])$/i);
 if (match) {
 return { id: null, serial_label: match[1].trim(), nature: match[2].toUpperCase() === 'M' ? '敏' : '普' };
 }
 // 无类型后缀，仅按serial_label匹配
 return { id: null, serial_label: input, nature: null };
 }

 // ========== 扫码添加 ==========
 function toggleAutoScan() {
 autoScanMode = document.getElementById('auto-scan-mode').checked;
 const input = document.getElementById('scan-input');
 if (autoScanMode) {
 input.placeholder = ' 扫码自动提交（无需按Enter）';
 } else {
 input.placeholder = '扫描包裹标签条形码（纯数字ID）';
 }
 }

 function handleScanInput(e) {
 const input = e.target;
 const query = input.value.trim();
 if (!query) return;

 if (autoScanMode) {
 // 自动模式：防抖提交（适配扫码枪连续输入）
 if (autoScanTimer) clearTimeout(autoScanTimer);
 autoScanTimer = setTimeout(async () => {
 const currentQuery = input.value.trim();
 if (currentQuery) {
 await scanAdd();
 }
 }, AUTO_SCAN_DELAY);
 }
 }

 function handleScanKey(e) {
 if (e.key === 'Enter') {
 e.preventDefault();
 scanAdd();
 }
 }

 async function scanAdd() {
 const input = document.getElementById('scan-input');
 const query = input.value.trim();
 if (!query || isCreating) return;

 // 检查批次
 if (!currentBatchId) {
 showToast('请先选择批次', 'error');
 input.value = '';
 input.focus();
 return;
 }

 // ===== 合箱准备状态检查 =====
 if (blockIfNotReady('合箱')) {
 input.value = '';
 return;
 }

 // 解析扫描数据
 const parsed = parseScanData(query);

 // 优先按包裹ID精准匹配（条码内容为 packed.id，全局唯一）
 let foundPkg = null;
 let foundIn = '';
 if (parsed.id) {
 let matched = null;
 let matchedIn = '';
 for (let [listKey, pkgs] of [['p', allPackages.p], ['m', allPackages.m]]) {
 for (let pkg of pkgs) {
 if (pkg.id === parsed.id) {
 matched = pkg;
 matchedIn = listKey;
 break;
 }
 }
 if (matched) break;
 }
 if (!matched) {
 addScanLog(query, 'error', `未找到ID=${parsed.id}的包裹`);
 showToast(`未找到ID=${parsed.id}的包裹`, 'error');
 input.value = '';
 input.focus();
 return;
 }
 if (matched.selected) {
 showToast(`包裹 ID=${parsed.id} 已添加过`, 'warning');
 input.value = '';
 input.focus();
 return;
 }
 foundPkg = matched;
 foundIn = matchedIn;
 } else {
 // 按 serial_label 查找（兼容旧标签/手动输入）
 // serial_label 格式："2-1"（旧）或 "2-1#123"（新，全局唯一）
 let allMatches = [];
 for (let [listKey, pkgs] of [['p', allPackages.p], ['m', allPackages.m]]) {
 for (let pkg of pkgs) {
 // 精确匹配或匹配 serial_label 的干净部分（#号之前）
 const cleanLabel = pkg.serial_label ? pkg.serial_label.split('#')[0] : '';
 const isMatch = pkg.serial_label === parsed.serial_label || cleanLabel === parsed.serial_label;
 if (isMatch) {
 if (parsed.nature && pkg.nature !== parsed.nature) continue;
 if (pkg.selected) continue;
 allMatches.push({ pkg, listKey });
 }
 }
 }
 if (allMatches.length === 0) {
 addScanLog(query, 'error', `未找到包裹 "${parsed.serial_label}"`);
 showToast(`未找到包裹: ${parsed.serial_label}`, 'error');
 input.value = '';
 input.focus();
 return;
 }
 if (allMatches.length > 1) {
 const names = allMatches.map(m => m.pkg.customer_name + '(' + m.pkg.serial_label + ')').join(', ');
 addScanLog(query, 'error', `"${parsed.serial_label}" 匹配到${allMatches.length}个包裹: ${names}`);
 showToast(`序号 ${parsed.serial_label} 匹配到${allMatches.length}个包裹，请扫描条形码（唯一ID）`, 'error');
 input.value = '';
 input.focus();
 return;
 }
 foundPkg = allMatches[0].pkg;
 foundIn = allMatches[0].listKey;
 }

 // 标记选中
 foundPkg.selected = true;
 _recordSelectAt(foundPkg.id);
 showToast(`已选中 #${foundPkg.id} ${foundPkg.customer_name}`, 'success');

 // 高亮被扫中的包裹
 highlightScannedPkg(foundPkg.id);

 if (cartonMode === 'one-by-one') {
 // ===== 逐个合箱模式：立即创建箱子 =====
 input.value = '';
 input.focus();
 const nature = foundPkg.nature;
 const typeText = nature === '敏' ? 'M' : 'P';

 // 箱子详情弹窗内 Enter 保存 + 方向键导航
(function() {
const navOrder = ['detail-weight', 'detail-length', 'detail-width', 'detail-height'];
document.addEventListener('keydown', function(e) {
 if (!document.getElementById('carton-detail-modal').classList.contains('active')) return;
 const active = document.activeElement;
 if (!active || !active.classList.contains('nav-input')) return;

 if (e.key === 'Enter') {
  e.preventDefault();
  updateCartonInfo();
  return;
 }

 const idx = navOrder.indexOf(active.id);
 if (idx === -1) return;
 let nextIdx = idx;
 if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
  if (active.id === 'detail-weight') nextIdx = 1;
  else nextIdx = (idx + 1) % navOrder.length;
 } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
  if (active.id !== 'detail-weight') nextIdx = idx - 1;
  else nextIdx = (idx - 1 + navOrder.length) % navOrder.length;
 } else return;

 const next = document.getElementById(navOrder[nextIdx]);
 if (next) { next.focus(); next.select(); }
 e.preventDefault();
});
})();

   bar.style.width = '0%';
   pct.textContent = '0%';
   
   let progress = 0;
   bulkExportTimer = setInterval(function() {
     progress += Math.random() * 8;
     if (progress > 85) progress = 85;
     bar.style.width = progress + '%';
     pct.textContent = Math.floor(progress) + '%';
   }, 400);
   
   try {
       let url = '/pdf/bulk_carton_labels?type=' + exportType;
       if (exportBatch) url += '&batch_id=' + exportBatch;
       const resp = await fetch(url);
       clearInterval(bulkExportTimer);
       bar.style.width = '100%';
       pct.textContent = '100%';
       
       if (!resp.ok) throw new Error('生成失败');
       const blob = await resp.blob();
       const objUrl = URL.createObjectURL(blob);
       const a = document.createElement('a');
       a.href = objUrl;
       a.download = '散箱标签_' + new Date().toISOString().slice(0,10) + '.pdf';
       document.body.appendChild(a);
       a.click();
       a.remove();
       URL.revokeObjectURL(objUrl);
       showToast('✅ PDF 下载完成', 'success');
   } catch(e) {
       clearInterval(bulkExportTimer);
       showToast('❌ ' + (e.message || '导出失败'), 'error');
   } finally {
       unlockAction();
       setTimeout(function() { panel.style.display = 'none'; }, 2000);
   }
 }
</script>
{% endblock %}
