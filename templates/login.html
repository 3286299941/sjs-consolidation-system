<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>速捷供应链 · 集运管理系统 - 登录</title>
 <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; background: #eef2f7; color: #1e293b; margin: 0; min-width: 1280px; overflow-x: auto; }
.page-head { text-align: center; padding: 22px 0 6px; }
.page-head h1 { font-size: 18px; color: #0a2540; font-weight: 700; }
.page-head p { font-size: 13px; color: #64748b; margin-top: 4px; }
.section { max-width: 1200px; margin: 16px auto; }
.section-title { font-size: 13px; color: #64748b; margin: 8px 0 10px; padding-left: 12px; border-left: 3px solid #0d47a1; font-weight: 500; }

.stage {
 position: relative; overflow: hidden;
 min-height: 100vh; min-width: 1280px; padding: 0 70px;
 background:
   radial-gradient(circle at 20% 18%, rgba(255,255,255,0.30), transparent 55%),
   radial-gradient(circle at 82% 30%, rgba(140,170,255,0.30), transparent 50%),
   linear-gradient(180deg, #3a63cf 0%, #2d52b6 45%, #214199 100%);
 display: flex; align-items: center;
}
.stage::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #1b2f9e 0%, #2450c8 40%, #f08020 100%); z-index: 5; }
/* 背景锁定画布：固定 1600px，缩放/缩窗口时背景不随窗口变形，超出部分裁剪 */
.bg-canvas { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1600px; height: 100vh; overflow: hidden; z-index: 0; }
.stars { position: absolute; inset: 0; pointer-events: none; }
.stars .st { fill: #ffffff; }
.stars .st-gold { fill: #fcd34d; }
@keyframes twinkle { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }
.tw { animation: twinkle 3.2s ease-in-out infinite; }
.tw2 { animation: twinkle 4.6s ease-in-out 1.2s infinite; }
.tw3 { animation: twinkle 3.8s ease-in-out 2.1s infinite; }

/* ===== 圆形地球概念图 ===== */
.earth-canvas { position: absolute; left: 130px; top: 50%; transform: translateY(-50%); width: 480px; height: 480px; z-index: 1; }
.earth-concept { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.earth-concept svg { width: 100%; height: 100%; display: block; }
.earth-concept::before { content: ""; position: absolute; inset: -18px; border-radius: 50%; box-shadow: 0 0 38px 10px rgba(125,211,252,0.5), 0 0 80px 26px rgba(96,165,250,0.25); }
/* 静态高级线条地球 */

/* ===== 背景线条装饰（飞机/轮船） ===== */
.deco { position: absolute; pointer-events: none; z-index: 1; }
.deco svg { display: block; width: 100%; height: auto; overflow: visible; }
.deco .stroke { fill: none; stroke: rgba(255,255,255,0.85); }
.deco .stroke-thin { fill: none; stroke: rgba(255,255,255,0.5); }
.deco .stroke-faint { fill: none; stroke: rgba(255,255,255,0.35); }
@keyframes float-x { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
.deco-float { animation: float-x 6s ease-in-out infinite; }

/* ===== 背景渐变粒子光效 ===== */
.particles { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.particles .p { position: absolute; border-radius: 50%; pointer-events: none; }
@keyframes float-y { 0%,100% { transform: translateY(0); opacity: 0.35; } 50% { transform: translateY(-22px); opacity: 0.85; } }
.particles .p { animation: float-y 7s ease-in-out infinite; }
/* 前景粒子（在地球前面，更大更亮） */
.particles-front { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
.particles-front .p { position: absolute; border-radius: 50%; pointer-events: none; animation: float-y 9s ease-in-out infinite; }

/* 右侧卡片 */
.side { position: fixed; right: 60px; top: 50%; transform: translateY(-50%); padding: 40px 15px 40px 30px; display: flex; align-items: center; z-index: 2; }
.card {
 background: rgba(255,255,255,0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
 border-radius: 18px; padding: 38px 36px 32px; width: 100%;
 box-shadow: 0 20px 60px rgba(0,0,0,0.32); border: 1px solid rgba(255,255,255,0.4);
}
.card .brand { text-align: center; margin-bottom: 24px; }
.card .brand img { width: 100%; max-width: 220px; height: auto; display: block; margin: 0 auto; }
.card .brand .name { margin-top: 8px; font-size: 12px; color: #94a3b8; letter-spacing: 5px; }
.card .fg { margin-bottom: 16px; position: relative; }
.card .fg .ic { position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #94a3b8; }
.card .fg input { width: 100%; padding: 11px 0 11px 28px; border: none; border-bottom: 1.5px solid #e2e8f0; font-size: 14px; outline: none; background: transparent; transition: border-color .25s; }
.card .fg input:focus { border-bottom-color: #2450c8; }
.card .fg:focus-within .ic { color: #2450c8; }
.card .btn { width: 100%; padding: 12px; margin-top: 8px; border: none; border-radius: 10px; background: linear-gradient(135deg, #1b2f9e, #2f6ae0); color: #fff; font-size: 14px; font-weight: 600; letter-spacing: 6px; cursor: pointer; box-shadow: 0 4px 14px rgba(27,47,158,0.25); }
.card .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(27,47,158,0.35); }
@media (max-width: 900px) {
 .stage { flex-direction: column; min-height: 860px; }
 .illust { flex: 0 0 440px; }
 .earth-concept { width: 300px; height: 300px; }
 .side { flex: 1; padding: 0 24px 30px; }
}

.error-msg { background: rgba(220,38,38,0.10); color: #dc2626; padding: 10px 14px; border-radius: 9px; margin-bottom: 16px; font-size: 13px; text-align: center; border: 1px solid rgba(220,38,38,0.18); }
 </style>
</head>

<script>
// 背景锁定（v3）：背景画布 position:fixed 固定在视口中央，登录框 fixed 固定在视口右侧（永远可见）。
// 用 devicePixelRatio 检测浏览器缩放（Ctrl+/-），反向 scale + 高度补偿，使背景保持物理尺寸不动；
// 轮询 300ms 兜底（部分环境浏览器缩放不触发 resize）。
(function () {
  var canvas = document.querySelector('.bg-canvas');
  if (!canvas) return;
  var baseDPR = window.devicePixelRatio || 1;
  function fit() {
    var dpr = window.devicePixelRatio || 1;
    var zoom = dpr / baseDPR;                       // 浏览器缩放倍数
    if (Math.abs(zoom - 1) > 0.02) {
      // 浏览器缩放 → 反向补偿（中心缩放，宽 1600px 与高度同时反向补偿，物理尺寸不变）
      canvas.style.transform = 'translate(-50%,-50%) scale(' + (1 / zoom).toFixed(4) + ')';
      canvas.style.height = (100 * zoom).toFixed(2) + 'vh';
    } else {
      // 正常/窗口拉伸 → 固定 1600px 居中，高度跟随视口
      canvas.style.transform = 'translate(-50%,-50%) scale(1)';
      canvas.style.height = '100vh';
    }
  }
  window.addEventListener('resize', fit);
  window.setInterval(fit, 300);                     // 轮询兜底
  fit();
})();
</script>
