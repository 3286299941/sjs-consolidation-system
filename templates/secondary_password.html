<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>二级密码验证 - 集运管理系统</title>
 <style>
 :root {
 --bg-primary: #f5f6fa;
 --bg-card: #ffffff;
 --accent: #667eea;
 --accent-hover: #5a6fd6;
 --secondary: #764ba2;
 --text-primary: #1e293b;
 --text-secondary: #64748b;
 --border: #e2e8f0;
 --danger: #ef4444;
 --radius: 10px;
 --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
 --transition: 0.2s ease;
 }
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body {
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
 background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
 min-height: 100vh;
 display: flex;
 align-items: center;
 justify-content: center;
 }
 .container {
 background: var(--bg-card);
 border-radius: 16px;
 padding: 48px 40px;
 width: 420px;
 max-width: 90vw;
 box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
 }
 .header {
 text-align: center;
 margin-bottom: 36px;
 }
 .header .icon {
 font-size: 48px;
 margin-bottom: 12px;
 }
 .header h1 {
 font-size: 20px;
 color: var(--text-primary);
 margin-bottom: 6px;
 }
 .header p {
 color: var(--text-secondary);
 font-size: 13px;
 }
 .form-group {
 margin-bottom: 20px;
 }
 .form-group label {
 display: block;
 font-weight: 500;
 color: var(--text-secondary);
 margin-bottom: 6px;
 font-size: 13px;
 }
 .form-group input {
 width: 100%;
 padding: 12px 16px;
 border: 1px solid var(--border);
 border-radius: var(--radius);
 font-size: 15px;
 color: var(--text-primary);
 background: var(--bg-primary);
 transition: all var(--transition);
 outline: none;
 }
 .form-group input:focus {
 border-color: var(--accent);
 box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
 }
 .error-msg {
 background: rgba(239, 68, 68, 0.08);
 color: var(--danger);
 padding: 10px 14px;
 border-radius: 8px;
 margin-bottom: 20px;
 font-size: 13px;
 text-align: center;
 display: none;
 }
 .btn-group {
 display: flex;
 gap: 12px;
 }
 .btn-submit {
 flex: 1;
 padding: 13px;
 background: linear-gradient(135deg, var(--accent), var(--secondary));
 color: white;
 border: none;
 border-radius: var(--radius);
 font-size: 15px;
 font-weight: 600;
 cursor: pointer;
 transition: all var(--transition);
 }
 .btn-submit:hover {
 transform: translateY(-1px);
 box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
 }
 .btn-cancel {
 padding: 13px 24px;
 background: var(--bg-primary);
 color: var(--text-secondary);
 border: 1px solid var(--border);
 border-radius: var(--radius);
 font-size: 15px;
 cursor: pointer;
 text-decoration: none;
 display: inline-flex;
 align-items: center;
 transition: all var(--transition);
 }
 .btn-cancel:hover {
 background: #e2e8f0;
 }
 </style>
</head>
<body>
 <div class="container">
 <div class="header">
 <div class="icon"></div>
 <h1>二级密码验证</h1>
 <p>访问「{{ title }}」需要输入二级密码</p>
 </div>
 <div class="error-msg" id="error-msg"></div>
 <form id="pwd-form" onsubmit="return verifyPwd(event)">
 <div class="form-group">
 <label>二级密码</label>
 <input type="password" id="sec-password" placeholder="请输入二级密码" required autofocus>
 </div>
 <div class="btn-group">
 <button type="submit" class="btn-submit">验 证</button>
 <a href="/" class="btn-cancel">取消</a>
 </div>
 </form>
 </div>

 <script>
 async function verifyPwd(e) {
 e.preventDefault();
 const pwd = document.getElementById('sec-password').value.trim();
 const errorEl = document.getElementById('error-msg');

 try {
 const res = await fetch('/api/verify_secondary_password', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ password: pwd })
 });
 const data = await res.json();

 if (data.success) {
 window.location.href = '{{ return_url }}';
 } else {
 errorEl.textContent = ' ' + (data.message || '二级密码错误');
 errorEl.style.display = 'block';
 document.getElementById('sec-password').value = '';
 document.getElementById('sec-password').focus();
 }
 } catch (err) {
 errorEl.textContent = ' 网络错误，请重试';
 errorEl.style.display = 'block';
 }
 }
 </script>
</body>
</html>
